# Alembic configuration for the Frost Detector live service.
#
# The database URL is not set here -- service/migrations/env.py reads it from the
# DATABASE_URL environment variable (defaulting to a local SQLite file), so
# migrations target the same database the app does.
#
#   alembic upgrade head        # apply migrations
#   alembic revision --autogenerate -m "..."   # new migration from model changes

[alembic]
script_location = service/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
