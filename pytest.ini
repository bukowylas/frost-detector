[pytest]
# tests/ also holds one-off investigation scripts (check_*, time_*, verify_*);
# only the unit tests are collected.
testpaths = tests/unit
addopts = -q
filterwarnings =
    # joblib triggers a NumPy 2.5 shape-setting deprecation deep in its pickle
    # code every time a model is (de)serialised -- thousands of times across the
    # predict tests. It is a third-party issue we cannot fix here; ignore it so
    # real warnings stay visible.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
